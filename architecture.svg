  <rect x="85" y="430" width="350" height="125" class="box" stroke="#55B6FF"/>
  <text x="120" y="478" class="h">Amazon Athena</text><text x="120" y="518" class="t">Bytes scanned + timing</text>
  <rect x="525" y="430" width="350" height="125" class="box" stroke="#FF9900"/>
  <text x="560" y="478" class="h">EMR Serverless</text><text x="560" y="518" class="t">Spark cross-engine read</text>
  <rect x="965" y="430" width="350" height="125" class="box" stroke="#E15FED"/>
  <text x="1000" y="478" class="h">Redshift Serverless</text><text x="1000" y="518" class="t">External-schema read</text>
  <path d="M1060 340 V395 H260 V420" class="arrow"/><path d="M1060 340 V395 H700 V420" class="arrow"/><path d="M1060 340 V420" class="arrow"/>

  <rect x="320" y="640" width="760" height="95" class="box" stroke="#43D17A"/>
  <text x="355" y="680" class="h">Deterministic verdict</text>
