<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788">
  <rect width="1400" height="788" fill="#0B1020"/>
  <style>
    .title{font:700 40px Arial;fill:#F7F9FC}.sub{font:22px Arial;fill:#AAB6CF}
    .box{fill:#151D33;stroke-width:3;rx:18}.h{font:700 24px Arial;fill:#F7F9FC}
    .t{font:19px Arial;fill:#AAB6CF}.arrow{stroke:#AAB6CF;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#AAB6CF"/></marker></defs>
  <text x="60" y="70" class="title">AI lakehouse optimization lab</text>
