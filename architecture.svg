  <text x="450" y="220" class="h">Policy gate</text>
  <text x="450" y="258" class="t">Read-only SQL</text><text x="450" y="286" class="t">Allow-listed identifiers</text>

  <rect x="790" y="150" width="550" height="190" class="box" stroke="#55B6FF"/>
  <text x="820" y="198" class="h">Shared S3 Tables / Iceberg data</text>
  <text x="820" y="237" class="t">Glue Data Catalog + Lake Formation</text>
  <text x="820" y="275" class="t">Unpartitioned baseline + partitioned candidate</text>
  <text x="820" y="313" class="t">Immutable 10,000-row validation fixture</text>

